[package]
name = "kernel"
version.workspace = true
authors.workspace = true
edition.workspace = true

[dependencies]
atomic.workspace = true
ecow.workspace = true
event-listener.workspace = true
extend.workspace = true
hashbrown.workspace = true
pin-project.workspace = true
riscv = { workspace = true, features = ["s-mode"] }
sbi-rt.workspace = true
smallvec.workspace = true
triomphe.workspace = true
virtio-drivers.workspace = true

common = { path = "../utils/common" }
console_output = { path = "../utils/console_output" }
defines = { path = "../utils/defines" }
devfs = { path = "../fs/devfs" }
executor = { path = "../utils/executor" }
fat32_vfs = { path = "../fs/fat32_vfs" }
hal = { path = "../drivers/hal" }
kernel_tracer = { path = "../utils/kernel_tracer" }
klocks = { path = "../utils/klocks" }
libkernel = { path = "../libkernel" }
procfs = { path = "../fs/procfs" }
qemu_plic = { path = "../drivers/qemu_plic" }
qemu_test = { path = "../drivers/qemu_test" }
qemu_uart = { path = "../drivers/qemu_uart" }
riscv_guard = { path = "../arch/riscv_guard" }
riscv_time = { path = "../arch/riscv_time" }
tmpfs = { path = "../fs/tmpfs" }
virtio_glue = { path = "../drivers/virtio_glue" }

anstyle = { version = "1.0", default-features = false }
fdt = { version = "0.1", features = ["pretty-printing"] }
slab = { version = "0.4", default-features = false }

[features]
default = []
# 是否使用 `span` 进行性能分析
profiling = []

[lints]
workspace = true
